<form class="create-classroom-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <!-- =========================
       INTRO
  ========================== -->

  <section class="create-classroom-form__intro">
    <div class="create-classroom-form__intro-icon" aria-hidden="true">
      <i data-lucide="school"></i>
    </div>

    <div>
      <span>Información general</span>

      <h3>Configura tu nueva clase</h3>

      <p>
        Define un nombre claro y agrega una descripción para que tus estudiantes puedan
        identificarla fácilmente.
      </p>
    </div>
  </section>

  <!-- =========================
       FIELDS
  ========================== -->

  <section class="create-classroom-form__fields">
    <app-input
      labelText="Nombre de la clase"
      helperText="Usa un nombre que tus estudiantes puedan identificar fácilmente."
      placeHolderText="Ej. Urgencias Médicas 2026"
      type="text"
      autocomplete="off"
      formControlName="name"
      [required]="true"
    />

    <app-text-area
      labelText="Descripción"
      helperText="Opcional"
      placeHolderText="Describe brevemente el propósito de esta clase..."
      formControlName="description"
    />
  </section>

  <!-- =========================
       INFORMATION
  ========================== -->

  <aside class="create-classroom-form__info">
    <div class="create-classroom-form__info-icon" aria-hidden="true">
      <i data-lucide="info"></i>
    </div>

    <p>Después de crear la clase se generará un código que podrás compartir con tus estudiantes.</p>
  </aside>

  <!-- =========================
       ACTIONS
  ========================== -->

  <footer class="create-classroom-form__actions">
    <app-button
      type="button"
      text="Cancelar"
      variant="secondary"
      [disabled]="loading()"
      (clicked)="cancel()"
    />

    <app-button
      type="submit"
      text="Crear clase"
      loadingText="Creando..."
      variant="primary"
      icon="plus"
      [loading]="loading()"
      [disabled]="loading()"
    />
  </footer>
</form>
